---
name: build

on:
  workflow_dispatch:
permissions:
  contents: read

env:
  LANG: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The integration tests take most of the job time, so they are split
        # by test class into shards that run in parallel. The last shard
        # excludes the classes of the others rather than listing its own, so
        # a new test class is never left out. Lint, unit and fuzz tests run
        # only on the first shard.
        include:
          - shard: 1
            tests: -n '/^TestFish#/'
          - shard: 2
            tests: -n '/^(TestZsh|TestNushell)#/'
          - shard: 3
            tests: -n '/^(TestCore|TestExec|TestPreview)#/'
          - shard: 4
            tests: -e '/^(TestFish|TestZsh|TestNushell|TestCore|TestExec|TestPreview)#/'
    name: build (${{ matrix.shard }})
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.23"

    - name: Setup Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: 3.4.6

    - name: Install packages
      run: |
        sudo install -d -m 0755 /etc/apt/keyrings
        wget -qO- https://apt.fury.io/nushell/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/fury-nushell.gpg
        echo "deb [signed-by=/etc/apt/keyrings/fury-nushell.gpg] https://apt.fury.io/nushell/ /" | sudo tee /etc/apt/sources.list.d/fury-nushell.list
        sudo apt-get update
        # Pinned: the Nushell scripts now require 0.116+, where an external
        # completer reaches the terminal through the @interactive attribute.
        # Before that (e.g. 0.115.0), completers run on a background thread, so
        # fzf never receives keystrokes. https://github.com/nushell/nushell/issues/18771
        sudo apt-get install --yes zsh fish tmux shfmt nushell=0.116.1-0

    - name: Install Ruby gems
      run: bundle install

    - name: Rubocop
      if: matrix.shard == 1
      run: make lint

    - name: Unit test
      if: matrix.shard == 1
      run: make test

    - name: Fuzz test
      if: matrix.shard == 1
      run: |
        go test ./src/algo/ -fuzz=FuzzIndexByteTwo -fuzztime=5s
        go test ./src/algo/ -fuzz=FuzzLastIndexByteTwo -fuzztime=5s

    - name: Integration test
      run: make install && ./install --all && tmux new-session -d && ruby test/runner.rb --verbose ${{ matrix.tests }}
